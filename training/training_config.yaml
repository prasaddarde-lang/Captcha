# Training configuration for the image-based CAPTCHA *type* classifier.
# The model answers "which kind of challenge is this?" - it never reads or answers the challenge.
# Paths are relative to the project root. Environment overrides: CAPTCHA_FW_DATASETS_DIR,
# CAPTCHA_FW_REPORTS_DIR, CAPTCHA_FW_MODELS_DIR.

seed: 20261030

dataset:
  root: datasets
  total_samples: 10000            # base dataset size (equal per category)
  split: {train: 0.8, validation: 0.1, test: 0.1}
  image_format: jpg               # jpg keeps 10k samples under ~100 MB
  jpeg_quality: 88
  categories:
    - text                # plain synthetic text challenge
    - text_distorted      # heavily warped / occluded text challenge
    - math                # arithmetic-expression challenge
    - audio               # audio challenge widget
    - image_classification  # "pick the image that ..." row/cluster
    - grid                # 3x3 / 4x4 tile-selection grid
    - recaptcha           # checkbox-widget lookalike (synthetic, no logos)
    - hcaptcha            # checkbox-widget lookalike (synthetic, no logos)
    - turnstile           # managed-challenge widget lookalike (synthetic, no logos)
    - none                # ordinary UI fragments (forms, tables, galleries, text...)
  source: "synthetic:training/generate_dataset.py"
  license: "Internal synthetic data generated by this project; no third-party content. Free to use internally."
  authorization_ref: "AUTH-SYNTH-2026-10-30 (project-generated; no external dataset used)"

augmentation:                     # continuous-improvement extra samples (train split only)
  per_iteration: 400
  max_total_extra: 4000

features:                         # must match core/image_features.py defaults
  width: 96
  height: 48

training:
  architectures: [nearest_centroid, softmax, mlp]   # compared on the validation set
  default_architecture: mlp
  hidden_units: 256
  epochs: 40
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  early_stopping_patience: 6
  device: auto                    # auto | cpu  (numpy backend: GPU is detected and reported, not used)

resources:
  max_cpu_threads: 4              # BLAS / OpenCV threads
  max_memory_mb: 2048             # training aborts (checkpointed) above this RSS
  max_training_minutes: 20        # per training run; stops at an epoch boundary with a checkpoint
  min_free_disk_mb: 300           # refuse to generate / train below this

promotion:                        # candidate vs production on the FIXED test set
  require_human_approval: true    # a named reviewer must approve before production
  min_accuracy_gain: 0.002
  max_category_f1_drop: 0.02
  max_false_positive_rate_increase: 0.005
  max_false_negative_rate_increase: 0.005
  initial_min_accuracy: 0.90      # first model (no production yet)
  initial_max_false_positive_rate: 0.05

continuous:
  max_iterations: 10              # per controller run
  max_run_minutes: 60
  patience: 3                     # stop after N iterations without a validated improvement
  interval_minutes: 0             # pause between iterations inside one run

inference:
  min_confidence: 0.80            # below this the image model never declares a CAPTCHA on its own
